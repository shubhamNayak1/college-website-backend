spring:
  application:
    name: baseras-portal-backend
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/baseras}
    username: ${DB_USER:baseras}
    password: ${DB_PASSWORD:baseras}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always

baseras:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-it-must-be-at-least-32-bytes-long-for-hs256}
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 1209600
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  result-check:
    rate-limit-attempts: 5
    rate-limit-window-minutes: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.baseras: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:baseras;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration
